da-kurzfassung-de: Um mit den eigenen Freunden auf einem Tischfußballtisch zusammenzuspielen, ist die geografische Lage der spielenden Teilnehmer essenziell. Auch wenn das gemeinsame Spiel noch so lustig ist, kommt es oftmals eher selten dazu, da das Zusammenkommen nicht immer so leicht ist. Zur Lösung dieses Problems ist bei DigiKicker der Aspekt der Hardware von dem tatsächlichen Spiel getrennt. Die Eingabemethode ändert sich im Vergleich zu einem analogen Tisch nicht, jedoch ist es durch die Entkopplung des Tisches von den Drehstäben möglich, auch ohne im gleichen Raum zu sein, zusammen zu spielen. Auch wenn niemand zum Spielen Zeit hat ist es möglich, das Spiel gegen algorithmisch basierte bzw. trainierte KI-Gegner zu spielen und die eigenen Fähigkeiten zu verbessern. Da die Dreheingabe mithilfe von Computermäusen keine sehr verbreitete Eingabemethode ist, sind die Ergebnisse dieser Arbeit möglicherweise auch für zukünftige Projekte nützlich, bei denen ähnliche Inputs verwendet werden müssen. Weil das Projekt von Anfang an auf eine Open-Source-Veröffentlichung angesetzt war und für den Nachbau eine schriftliche Anleitung existiert, sollte es ein Leichtes sein auf dem gelegten Fundament aufzubauen.

da-kurzfassung-en: To play on a foosball table with friends, the geographical location of the participants is essential. No matter how fun playing together is though, real games happen quite rarely, since getting together isn't always easy with everybody having full calendars. To solve this problem, the project DigiKicker has separated the hardware from the actual gameplay. Controlling the game works the exact same way as with an analogue table. With the decoupled hardware it is possible to play with friends from anywhere around the world, since it is easy to connect without being in the same room. And even if no friends have time to play for once, it is possible to hone one's personal skills by playing against algorithmically based / AI trained enemies. Since measuring the signals via a set of computer mice is quite an unconventional method, the results of this thesis might be useful for future projects that need a similar type of input. Since the project was planned to be released in an open source format from the start an instruction set to recreate the project was created. With those prerequisites it should be easy for future projects to build upon this one.

da-danksagung: Mit diesem Abschnitt wollen wir als Team hinter der Diplomarbeit "DigiKicker - Digitalisierung eines Tischfußballtisches" einige Danksagungen für Menschen tätigen, welche die Arbeit an diesem Projekt erleichtert haben. Zuallererst wollen wir uns bei unserem Professor und Betreuer Günther Hutter bedanken. Sie waren während der Arbeit an unserer Diplomarbeit und in unserer ganzen Schullaufbahn stets für uns da und zögerten nie uns zu helfen, egal welches Problem wir hatten. Ob es um Hobbyprojekte oder schulische Themen ging waren Sie stets ein Vorbild und lehrten uns alles mögliche rund um Softwareentwicklung, Netzwerktechnik und viele weitere Dinge, die Sie immer mit Enthusiasmus erklärt haben. Für ihre stetige Hilfe und konstruktive Kritik wollen wir uns zutiefst bedanken. Als Projektleiter will ich mich außerdem bei meinem ganzen Team bedanken, welches die Zusammenarbeit an dem Projekt für mich wirklich erleichtert hat. Mit euch hat die Entwicklung fast spielerisch gewirkt und war keineswegs anstrengend, wofür ich wirklich sehr dankbar bin. Ein zusätzlicher Dank geht außerdem an alle Menschen in unserem Umfeld, welche uns persönlich und mental in den anstrengenden Phasen unterstützt haben und stets an uns geglaubt haben.

